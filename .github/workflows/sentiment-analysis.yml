#This action is centrally managed in https://github.com/asyncapi/.github/
#Don't make changes to this file in this repo as they will be overwritten with changes made to the same file in above mentioned repo

name: 'Sentiment Analysis'

on: 
    issue_comment:
        types: 
            - created
            - edited
    issues:
        types:
            - opened
            - edited
    pull_request:
        types:
            - opened
            - edited
    pull_request_review:
        types:
            - submitted
            - edited
    pull_request_review_comment:
        types:
            - created
            - edited
jobs:
    test:
        name: Checking sentiments
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        - name: Check sentiment
          uses: derberg/code-of-conduct-sentiment-analysis-github-action@15d0c5da7dfb2eca7a8fdf12b4827737e4dfb862 # v1
          id: sentiments
          with:
            gcp_key: ${{ secrets.GCP_KEY_SENTIMENT }} 
        - uses: someimportantcompany/github-actions-slack-message@a975b440de2bcef178d451cc70d4c1161b5a30cd # v1
            # this step runs only if sentiment is a negative number
          if: steps.sentiments.outputs.sentiment < -0.6
          with:
            webhook-url: ${{ secrets.SLACK_SENTIMENTS }}
            text: Here ${{steps.sentiments.outputs.source}} you can find a potential negative text that requires your attention as the sentiment analysis score is ${{steps.sentiments.outputs.sentiment}}
            color: orange